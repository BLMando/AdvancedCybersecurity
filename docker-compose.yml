services:

  # ── Identity & PKI (Certificate Management) ─────
  identity-pki:
    build:
      context: ./identity_pki
      dockerfile: Dockerfile
    container_name: identity-pki
    restart: on-failure
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      IDENTITY_APP_HOST: 0.0.0.0
      IDENTITY_APP_PORT: 8080
      ZTA_PKI_DATA_DIR: /data/certs
      ZTA_PKI_ORGANIZATION: ${ZTA_PKI_ORGANIZATION}
      ZTA_PKI_CA_CN: ${ZTA_PKI_CA_CN}
    volumes:
      - ./volumes/certs/ca:/data/certs
      - ./volumes/certs/server:/data/server
      - ./volumes/certs/client:/data/certs/client
    networks:
      - backend-net

  # ── MongoDB ────────────────────────────────────────
  mongo:
    build:
      context: ./mongo
      dockerfile: Dockerfile
    container_name: mongo
    restart: unless-stopped
    # ONLY FOR DEV, MONGO SHOULD NOT BE EXPOSED IN PRODUCTION
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    volumes:
      - mongdata:/data/db
    networks:
      - backend-net

  # ── Envoy Proxy (PEP) ─────────────────────────────
  envoy:
    build:
      context: ./envoy
      dockerfile: Dockerfile
    container_name: envoy
    restart: unless-stopped
    depends_on:
      - mongo
      - identity-pki
      - opa
    ports:
      - "10000:10000"
      - "10001:10001"
      - "127.0.0.1:9901:9901"
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./volumes/certs/ca:/etc/certs/ca:ro
      - ./volumes/certs/server:/etc/certs/server:ro
      - envoy-logs:/var/log/envoy
    networks:
      - frontend-net
      - backend-net

  # ── OPA Splunk Forwarder (Sidecar) ─────────────────
  opa-splunk-forwarder:
    build:
      context: ./scripts/opa_splunk_forwarder
      dockerfile: Dockerfile
    container_name: opa-splunk-forwarder
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      SPLUNK_HOST: splunk
      SPLUNK_HEC_PORT: "8088"
      SPLUNK_HEC_TOKEN_ENVOY: ${SPLUNK_HEC_TOKEN_ENVOY}
      SPLUNK_MGMT_PORT: "8089"
      SPLUNK_USERNAME: admin
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD}
      HEC_BATCH_SIZE: "100"
    volumes:
      - envoy-logs:/var/log/envoy:ro
    depends_on:
      - splunk
    networks:
      - backend-net

  # ── OPA (PDP) ──────────────────────────────────────
  opa:
    build:
      context: ./opa
      dockerfile: Dockerfile
    container_name: opa
    restart: unless-stopped
    depends_on:
      - opa-splunk-forwarder
    ports:
      - "127.0.0.1:8181:8181"
      - "127.0.0.1:9002:9002"
    volumes:
      - ./opa/policies:/policies:ro
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --set=plugins.envoy_ext_authz_grpc.addr=:9002
      - --log-level=info
      - /policies
    networks:
      - backend-net

  # ── Snort 3 (NIDS) ────────────────────────────────
  snort:
    image: ciscotalos/snort3:latest
    container_name: snort
    restart: unless-stopped
    entrypoint: [ "/bin/sh", "-c" ]
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host
    volumes:
      - ./snort/snort.lua:/etc/snort/snort.lua:ro
      - ./snort/rules:/etc/snort/rules:ro
      - ./volumes/snort/logs:/var/log/snort
    command:
      - |
        if ! snort -i eth0 -c /etc/snort/snort.lua --alert-before-pass -A alert_json -l /var/log/snort; then
          echo "snort failed to start, container kept alive for debugging"
        fi
        tail -f /dev/null

  # ── NFTables (L3/L4 Firewall) ──────────────────────
  nftables:
    image: alpine:latest
    container_name: nftables
    restart: unless-stopped
    entrypoint: [ "/bin/sh", "-c" ]
    cap_add:
      - NET_ADMIN
    network_mode: host
    volumes:
      - ./nftables/nftables.conf:/etc/nftables.conf:ro
      - ./volumes/nftables/logs:/var/log/nftables
    command:
      - |
        apk add --no-cache nftables
        if [ "$${APPLY_NFT_RULES:-0}" = "1" ]; then
          tr -d '\r' < /etc/nftables.conf > /tmp/nftables.conf
          if ! nft -f /tmp/nftables.conf; then
            echo "nftables rules failed, container kept alive for debugging"
          fi
        else
          echo "nftables safe mode: rules not applied (set APPLY_NFT_RULES=1 to enable)"
        fi
        tail -f /dev/null

  splunk:
    image: splunk/splunk:latest
    container_name: splunk
    # removed platform: linux/amd64 to use native arm64 on Apple Silicon
    # nome utente: admin
    environment:
      - SPLUNK_START_ARGS=--accept-license --answer-yes --no-prompt --ignore-critical-errors
      - SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com
      - SPLUNK_PASSWORD=SplunkPassword123!
      - SPLUNK_IGNORE_FILE_SYSTEM_FOR_DB=1
      - OPTIMISTIC_ABOUT_FILE_LOCKING=1
    ports:
      - "8000:8000"
      - "8088:8088"
      - "8089:8089"
      - "9997:9997"
    volumes:
      - splunk-var:/opt/splunk/var
      - splunk-etc:/opt/splunk/etc
    networks:
      - backend-net
    restart: always

volumes:
  splunk-var:
  splunk-etc:
  mongdata:
  envoy-logs:

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

# Networks defined above
