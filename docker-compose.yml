services:

  # ── Identity & PKI (Certificate Management) ─────
  identity-pki:
    build:
      context: ./identity_pki
      dockerfile: Dockerfile
    container_name: identity-pki
    restart: on-failure
    ports:
      - "127.0.0.1:${IDENTITY_APP_PORT}:8080"
    environment:
      IDENTITY_APP_HOST: 0.0.0.0
      IDENTITY_APP_PORT: 8080
      IDENTITY_APP_DEBUG: false
      ZTA_PKI_DATA_DIR: /data/certs
      ZTA_PKI_ORGANIZATION: ${ZTA_PKI_ORGANIZATION}
      ZTA_PKI_CA_CN: ${ZTA_PKI_CA_CN}
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_DATABASE: ${MONGO_DATABASE}
      MONGO_PORT: 27017
      ENVOY_PROXY_PORT: 10000
      SMTP_EMAIL: ${SMTP_EMAIL}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    volumes:
      - ./volumes/certs/ca:/data/certs
      - ./volumes/certs/server:/data/server
      - ./volumes/certs/client:/data/certs/client
      - ./shared:/app/shared:ro
      - ./identity_pki/templates:/app/identity_pki/templates
      - ./identity_pki/static:/app/identity_pki/static
    networks:
      - backend-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── MongoDB ────────────────────────────────────────
  mongo:
    build:
      context: ./mongo
      dockerfile: Dockerfile
    container_name: mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_PORT}:27017"
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_DATABASE: ${MONGO_DATABASE}
      MONGO_PORT: 27017
    volumes:
      - mongdata:/data/db
      - ./volumes/certs/ca:/etc/certs/ca:ro
      - ./volumes/certs/server:/etc/certs/server:ro
      - ./mongo:/app/mongo:ro
      - mongo-logs:/var/log/mongodb
    networks:
      - backend-net

  # ── Custom MongoDB Proxy ────────────────────────────
  mongo-proxy:
    build:
      context: ./mongo_proxy
      dockerfile: Dockerfile
    container_name: mongo-proxy
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_started
    ports:
      - "127.0.0.1:${MONGO_PROXY_PORT}:5001"
    environment:
      MONGO_DATABASE: ${MONGO_DATABASE}
      MONGO_PORT: 27017
      MONGO_PROXY_PORT: 5001
    volumes:
      - ./volumes/certs/ca:/etc/certs/ca:ro
      - ./volumes/certs/server:/etc/certs/server:ro
    networks:
      - backend-net

  # ── Envoy Log Init (Correzione Permessi Volume) ────
  envoy-log-init:
    image: alpine:latest
    container_name: envoy-log-init
    user: root
    volumes:
      - envoy-logs:/var/log/envoy
    command: chown -R 101:101 /var/log/envoy

  # ── Envoy Proxy (PEP) ─────────────────────────────
  envoy:
    build:
      context: ./envoy
      dockerfile: Dockerfile
    container_name: envoy
    restart: unless-stopped
    depends_on:
      envoy-log-init:
        condition: service_completed_successfully
      mongo:
        condition: service_started
      identity-pki:
        condition: service_started
      opa:
        condition: service_started
    ports:
      - "${ENVOY_PROXY_PORT}:10000"
      - "127.0.0.1:${ENVOY_ADMIN_PORT}:9901"
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./envoy/lua:/etc/envoy/lua:ro
      - ./volumes/certs/ca:/etc/certs/ca:ro
      - ./volumes/certs/server:/etc/certs/server:ro
      - envoy-logs:/var/log/envoy
    networks:
      - frontend-net
      - backend-net
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9901'" ]
      interval: 5s
      timeout: 2s
      retries: 5

  # ── ZTA Log Forwarder (Sidecar) ─────────────────
  zta-log-forwarder:
    build:
      context: ./scripts/zta_log_forwarder
      dockerfile: Dockerfile
    container_name: zta-log-forwarder
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOG_FORWARDER_PORT}:5000"
    environment:
      SPLUNK_HOST: ${SPLUNK_HOST}
      SPLUNK_USERNAME: ${SPLUNK_USERNAME}
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD}
      SPLUNK_HEC_PORT: ${SPLUNK_HEC_PORT}
      SPLUNK_MGMT_PORT: ${SPLUNK_MGMT_PORT}
      SPLUNK_VERIFY_TLS: ${SPLUNK_VERIFY_TLS}
      SPLUNK_HEC_TOKEN_ENVOY: ${SPLUNK_HEC_TOKEN_ENVOY}
      HEC_BATCH_SIZE: "100"
    volumes:
      - envoy-logs:/var/log/envoy:ro
      - snort-pep-logs:/var/log/snort-pep:ro
      - snort-resource-logs:/var/log/snort-resource:ro
      - nftables-logs:/var/log/nftables:ro
      - mongo-logs:/var/log/mongodb:ro
    depends_on:
      - splunk
    networks:
      - backend-net

  # ── OPA (PDP) ──────────────────────────────────────
  opa:
    platform: linux/amd64
    build:
      context: ./opa
      dockerfile: Dockerfile
    container_name: opa
    restart: unless-stopped
    depends_on:
      - zta-log-forwarder
      - identity-pki
    ports:
      - "127.0.0.1:${OPA_API_PORT}:8181"
      - "127.0.0.1:${OPA_GRPC_PORT}:9002"
    volumes:
      - ./opa/policies:/policies:ro
      - ./volumes/certs/ca:/etc/certs/ca:ro
      - ./volumes/certs/server:/etc/certs/server:ro
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --set=plugins.envoy_ext_authz_grpc.addr=:9002
      - --set=plugins.envoy_ext_authz_grpc.path=envoy/authz/main
      - --set=services.log-forwarder.url=http://zta-log-forwarder:5000
      - --set=decision_logs.service=log-forwarder
      - --set=decision_logs.reporting.min_delay_seconds=1
      - --set=decision_logs.reporting.max_delay_seconds=2
      - --log-level=info
      - /policies
    networks:
      - backend-net

  # ── Snort 3 — Sonda PEP (post-firewall, pre-autorizzazione) ──────────
  snort-pep:
    image: ciscotalos/snort3:latest
    container_name: snort-pep
    user: root
    restart: unless-stopped
    entrypoint: [ "/bin/sh", "-c" ]
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: "service:envoy"
    depends_on:
      envoy:
        condition: service_healthy
    volumes:
      - ./snort/snort.lua:/etc/snort/snort.lua:ro
      - ./snort/rules/pep.rules:/etc/snort/rules/local.rules:ro
      - snort-pep-logs:/var/log/snort
    command:
      - |
        echo "[snort-pep] Starting PEP NIDS (Envoy namespace)..."
        mkdir -p /var/log/snort

        # In sidecar mode, sniffa sull'interfaccia eth1 di Envoy (backend-net)
        if ! /home/snorty/snort3/bin/snort -c /etc/snort/snort.lua --include-path /home/snorty/snort3/etc/snort --daq afpacket --daq-var snaplen=65535 -i "eth1" -l /var/log/snort 2>&1; then
          echo "[snort-pep] ERROR: Snort failed to start"
        fi
        tail -f /dev/null

  # ── Snort 3 — Sonda Risorsa (ispeziona il traffico autenticato e autorizzato) ────
  snort-resource:
    image: ciscotalos/snort3:latest
    container_name: snort-resource
    user: root
    restart: unless-stopped
    entrypoint: [ "/bin/sh", "-c" ]
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: "service:mongo"
    depends_on:
      mongo:
        condition: service_started
    volumes:
      - ./snort/snort.lua:/etc/snort/snort.lua:ro
      - ./snort/rules/resource.rules:/etc/snort/rules/local.rules:ro
      - snort-resource-logs:/var/log/snort
    command:
      - |
        echo "[snort-resource] Starting Resource NIDS (MongoDB namespace)..."
        mkdir -p /var/log/snort

        # In sidecar mode, sniffa sull'interfaccia eth0 di MongoDB
        if ! /home/snorty/snort3/bin/snort -c /etc/snort/snort.lua --include-path /home/snorty/snort3/etc/snort --daq afpacket --daq-var snaplen=65535 -i "eth0" -l /var/log/snort 2>&1; then
          echo "[snort-resource] ERROR: Snort failed to start"
        fi
        tail -f /dev/null

  # ── NFTables (L3/L4 Firewall — applica regole netfilter al traffico in ingresso verso il PEP) ────
  nftables:
    image: alpine:latest
    container_name: nftables
    restart: unless-stopped
    environment:
      APPLY_NFT_RULES: "1"
    entrypoint: [ "/bin/sh", "-c" ]
    cap_add:
      - NET_ADMIN
    network_mode: "service:envoy"
    depends_on:
      envoy:
        condition: service_healthy
    volumes:
      - ./nftables/nftables.conf:/etc/nftables.conf:ro
      - nftables-logs:/var/log/nftables
    healthcheck:
      test: [ "CMD-SHELL", "nft list table inet zero_trust_fw > /dev/null 2>&1" ]
      interval: 10s
      timeout: 2s
      retries: 3
    command:
      - |
        apk add --no-cache nftables

        # Crea directory log
        mkdir -p /var/log/nftables

        # Applica regole nftables nel namespace di Envoy
        if [ "$${APPLY_NFT_RULES:-0}" = "1" ]; then
          tr -d '\r' < /etc/nftables.conf > /tmp/nftables.conf
          if nft -f /tmp/nftables.conf; then
            echo "[nftables] Rules applied to Envoy namespace"
            nft list ruleset
          else
            echo "[nftables] ERROR: Rules failed to apply"
          fi
        else
          echo "[nftables] Safe mode: rules NOT applied (set APPLY_NFT_RULES=1)"
        fi

        # Cattura log da nft counter (polling periodico)
        echo "[nftables] Starting counter log capture..."
        while true; do
          nft list ruleset 2>/dev/null | grep -E "counter packets [1-9]" >> /var/log/nftables/nft.log
          sleep 30
        done &

        echo "[nftables] Sidecar ready (Envoy namespace)"
        tail -f /dev/null

  splunk:
    image: splunk/splunk:latest
    container_name: splunk
    platform: linux/amd64
    environment:
      - SPLUNK_START_ARGS=--accept-license --answer-yes --no-prompt --ignore-critical-errors
      - SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com
      - SPLUNK_PASSWORD=${SPLUNK_PASSWORD}
      - SPLUNK_IGNORE_FILE_SYSTEM_FOR_DB=1
      - OPTIMISTIC_ABOUT_FILE_LOCKING=1
    ports:
      - "${SPLUNK_WEB_PORT}:8000"
      - "${SPLUNK_HEC_PORT}:8088"
      - "${SPLUNK_MGMT_PORT}:8089"
      - "${SPLUNK_RECEIVER_PORT}:9997"
    volumes:
      - splunk-var:/opt/splunk/var
      - splunk-etc:/opt/splunk/etc
      - ./splunk/splunk_setup.py:/app/splunk_setup.py:ro
      - ./splunk/dashboards:/app/dashboards:ro
    networks:
      - backend-net
    restart: always
    entrypoint: /bin/bash
    command:
      - -c
      - |
        (SPLUNK_HOST=localhost python3 /app/splunk_setup.py || true) &
        exec /sbin/entrypoint.sh start-service

volumes:
  splunk-var:
  splunk-etc:
  mongdata:
  envoy-logs:
  snort-pep-logs:
  snort-resource-logs:
  nftables-logs:
  mongo-logs:

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
