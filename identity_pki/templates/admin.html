<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZTA Admin Registry</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .status-active { color: var(--success); font-weight: 600; }
        .status-revoked { color: var(--error); text-decoration: line-through; opacity: 0.7; }
        .admin-back {
            margin-top: 24px;
            display: inline-flex;
        }
    </style>
</head>
<body>
    <main class="shell">
        <header class="header-row">
            <h1>Zero Trust Identity Registry</h1>
            <span class="badge badge-warning">Hardware Attestation CA</span>
        </header>
        
        <section class="panel">
            <h2>Utenti e Certificati Attivi</h2>
            <div class="table-container">
                <table id="certTable">
                    <thead>
                        <tr>
                            <th>User (Common Name)</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td colspan="3" style="text-align: center; color: var(--muted); padding: 24px;">Caricamento identità...</td></tr>
                    </tbody>
                </table>
            </div>
            <a href="/" class="ghost-link admin-back">← Torna alla Console</a>
        </section>
    </main>

    <script>
        async function loadCerts() {
            try {
                const resp = await fetch('/api/admin/certificates');
                const certs = await resp.json();
                const tbody = document.querySelector('#certTable tbody');
                
                if (!certs || certs.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: var(--muted); padding: 24px;">Nessun certificato attivo o revocato nel database.</td></tr>`;
                    return;
                }
                
                tbody.innerHTML = certs.map(c => `
                    <tr>
                        <td style="font-weight: 600;">${c.user}</td>
                        <td><span class="status-${c.status}">${c.status.toUpperCase()}</span></td>
                        <td>
                            ${c.status === 'active' ? 
                                `<button class="danger" style="min-height: 36px; border-radius: 8px; font-size: 0.85rem;" onclick="revoke('${c.user}')">Revoke Hardware Identity</button>` : 
                                `<button disabled style="min-height: 36px; border-radius: 8px; font-size: 0.85rem;">Revoked</button>`}
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error("Failed to load certificates:", err);
            }
        }

        async function revoke(user) {
            if (!confirm(`Sei sicuro di voler REVOCARE l'identità hardware per l'utente ${user}?`)) return;
            try {
                const resp = await fetch('/api/admin/revoke', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user })
                });
                if (resp.ok) {
                    loadCerts();
                } else {
                    const data = await resp.json();
                    alert(`Errore durante la revoca: ${data.error || 'Server error'}`);
                }
            } catch (err) {
                alert(`Errore di connessione: ${err.message}`);
            }
        }

        loadCerts();
        setInterval(loadCerts, 5000);
    </script>
</body>
</html>
