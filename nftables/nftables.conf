#!/usr/bin/nft -f
# NFTables Configuration for Zero Trust Architecture
# Layer 3/4 Filtering

flush ruleset

# ─── Table Definition ─────────────────────────────
table inet filter {
    # ─── Blocklist Set (Dynamic) ───────────────
    set blocklist {
        type ipv4_addr
        flags interval,timeout
        timeout 1h
        gc-interval 10s
    }

    # ─── Input Chain (Ingress Filtering) ───────
    chain input {
        type filter hook input priority 0
        policy drop

        # Block IPs in blocklist first
        ip saddr @blocklist drop

        # Accept loopback
        iif lo accept

        # Accept established connections
        ct state established,related accept
        ct state invalid drop

        # Accept SSH (port 22)
        tcp dport 22 accept

        # Accept Envoy (port 10000)
        tcp dport 10000 accept

        # Accept OPA REST API (port 8181)
        tcp dport 8181 accept

        # Accept OPA gRPC (port 9002)
        tcp dport 9002 accept

        # Block MongoDB direct access (port 27017)
        tcp dport 27017 drop

        # Rate limiting for new connections (DDoS protection)
        tcp flags syn limit rate 20/second burst 50 packets accept
        tcp flags syn drop

        # ICMP (ping) limited rate
        icmp type echo-request limit rate 5/second accept

        # Log rejected packets (optional, use sparingly)
        # reject with icmp type admin-prohibited

        # Default: drop
        drop
    }

    # ─── Forward Chain (Transit Filtering) ─────
    chain forward {
        type filter hook forward priority 0
        policy drop

        # Block IPs in blocklist first
        ip saddr @blocklist drop

        # Accept established connections
        ct state established,related accept
        ct state invalid drop

        # Accept traffic between Docker networks for ZTA flow
        # frontend-net → Envoy → backend-net
        accept
    }

    # ─── Output Chain (Egress Filtering) ───────
    chain output {
        type filter hook output priority 0
        policy accept

        # Optional: restrict outbound connections from containers
        # ct state established,related accept
        # drop
    }
}

# Rules loaded successfully when nft -f exits with code 0.
