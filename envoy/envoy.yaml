static_resources:
  listeners:
    # ─── MongoDB Listener with mTLS ────────────────────
    - name: mongo_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      listener_filters:
        # Run before TLS termination so Envoy can inspect the ClientHello
        # and derive the JA3 fingerprint used as a device hint.
        - name: envoy.filters.listener.tls_inspector
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
            enable_ja3_fingerprinting: true
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                # [LAB-ONLY] Envoy presents this certificate to the client.
                # PRO-TIP: In production, use SDS (Secret Discovery Service) instead of local files.
                tls_certificates:
                  - certificate_chain:
                      filename: /etc/certs/server/envoy.crt
                    private_key:
                      filename: /etc/certs/server/envoy.key
                validation_context:
                  # Trusted CA used to validate client certificates.
                  # PRO-TIP: Use SDS to fetch the CA bundle dynamically.
                  trusted_ca:
                    filename: /etc/certs/ca/ca.crt
              # Fail closed: the connection is rejected if the client does not
              # present a valid certificate.
              require_client_certificate: true
          filters:
            # NOTE: network Lua filter type is not available in the tested
            # official Envoy images (including contrib variants).

            # Mongo proxy inspects the MongoDB wire protocol so we can log the
            # actual command and collection being accessed.
            - name: envoy.filters.network.mongo_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.mongo_proxy.v3.MongoProxy
                stat_prefix: mongo_stats

            # Ask OPA for an allow/deny decision before forwarding traffic to
            # MongoDB. This is the policy gate of the system.
            - name: envoy.filters.network.ext_authz
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.ext_authz.v3.ExtAuthz
                stat_prefix: opa_authz
                transport_api_version: V3
                include_peer_certificate: true
                metadata_context_namespaces:
                  - envoy.filters.listener.tls_inspector
                grpc_service:
                  envoy_grpc:
                    cluster_name: opa_cluster
                  timeout: 2s
                failure_mode_allow: false
                # Fail closed: if OPA is unavailable, the request is denied.

            # If the request passes the checks, forward it to MongoDB.
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: mongo_tcp
                cluster: mongo_cluster
                upstream_connect_mode: ON_DOWNSTREAM_DATA
                max_early_data_bytes: 1048576

    # ─── HTTP Listener for mTLS Testing ────────────────
    - name: http_test_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10001
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain: { filename: "/etc/certs/server/envoy.crt" }
                    private_key: { filename: "/etc/certs/server/envoy.key" }
                validation_context:
                  trusted_ca: { filename: "/etc/certs/ca/ca.crt" }
              require_client_certificate: true
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local_service
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          direct_response:
                            status: 200
                            body: { inline_string: "✓ ZTA Hardware mTLS Verified!" }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  # ─── Clusters ──────────────────────────────────────
  clusters:
    - name: mongo_cluster
      connect_timeout: 2s
      type: STRICT_DNS
      load_assignment:
        cluster_name: mongo_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: mongo
                      port_value: 27017

    - name: opa_cluster
      connect_timeout: 2s
      type: STRICT_DNS
      http2_protocol_options: {}
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: opa_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: opa
                      port_value: 9002

admin:
  access_log_path: /tmp/admin_access.log
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
