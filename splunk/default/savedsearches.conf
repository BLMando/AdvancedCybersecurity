[Generazione_Baseline_Utenti_15m]
search = index=zta_envoy sourcetype="opa:decision" | bucket _time span=15m | stats count as query_count by user, _time | sistats count by user, _time
cron_schedule = 5 * * * *
dispatch.earliest_time = -1h
dispatch.latest_time = now
action.summary_index = 1
action.summary_index._name = zta_baseline_summary
enableSched = 1

[Calcolo_Rischio_Contestuale_ZTA]
search = index=zta_baseline_summary user="$user$" earliest=-7d \
  | stats count as query_count by _time, user \
  | eventstats avg(query_count) as media_storica, stdev(query_count) as dev_std by user \
  | append [ \
      search (index=zta_envoy OR index=zta_snort OR index=zta_nftables OR index=zta_mongodb_audit) ("$client_ip$" OR "$user$") earliest=-15m \
      | eval tipo=case(index="zta_envoy" AND decision="DENY", "deny", index="zta_snort", "snort", index="zta_nftables" AND action="DROP", "nftables", index="zta_mongodb_audit" AND result!=0, "mongo", 1=1, "allow") \
      | eval eta_min = (now() - _time) / 60 \
      | eval peso_snort = if(tipo="snort", exp(-0.231 * eta_min), 0) \
      | stats count(eval(tipo="deny")) as c_deny, sum(peso_snort) as cur_snort, count(eval(tipo="nftables")) as c_nftables, count(eval(tipo="mongo")) as c_mongo, count(eval(tipo="allow")) as c_allow \
    ] \
  | stats first(media_storica) as mu, first(dev_std) as sigma, max(c_allow) as cur_allow, max(c_deny) as cur_deny, max(cur_snort) as cur_snort, max(c_nftables) as cur_nftables, max(c_mongo) as cur_mongo \
  | eval z_score = if(sigma > 0 AND NOT isnull(cur_allow), (cur_allow - mu) / sigma, 0) \
  | eval uba_boost = case(z_score >= 3.0, 40, z_score >= 2.0, 20, 1=1, 0) \
  | eval deny_boost = case(cur_deny >= 10, 30, cur_deny >= 5, 15, 1=1, 0) \
  | eval snort_boost = case(cur_snort >= 5, 100, cur_snort >= 1, 80, 1=1, 0) \
  | eval nft_boost = case(cur_nftables >= 50, 20, cur_nftables >= 10, 10, 1=1, 0) \
  | eval mongo_boost = case(cur_mongo >= 10, 40, cur_mongo >= 3, 20, 1=1, 0) \
  | eval anomaly_risk = min(100, uba_boost + deny_boost + snort_boost + nft_boost + mongo_boost) \
  | table anomaly_risk
